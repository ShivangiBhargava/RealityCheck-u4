<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0079C1"/>
      <stop offset="1" stop-color="#00457C"/>
    </linearGradient>
    <radialGradient id="light" cx="0.28" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#6fd0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9D0"/>
      <stop offset="1" stop-color="#19D3A2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="12" result="b"/>
      <feFlood flood-color="#00203d" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <g id="person">
      <circle cx="256" cy="104" r="31" fill="#FFFFFF"/>
      <path d="M184 196 C184 164 214 142 256 142 C298 142 328 164 328 196 Q328 204 320 204 L192 204 Q184 204 184 196 Z" fill="#FFFFFF"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#light)"/>
    <!-- ripple rings: impact spreading outward -->
    <circle cx="256" cy="286" r="214" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="256" cy="286" r="168" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="256" cy="286" r="124" fill="#fff" fill-opacity="0.05"/>
  </g>

  <g transform="translate(256 290) scale(1.1) translate(-256 -256)">
    <g filter="url(#shadow)">
      <use href="#person"/>
      <use href="#person" transform="rotate(120 256 256)"/>
      <use href="#person" transform="rotate(240 256 256)"/>
    </g>
    <!-- center verified badge -->
    <circle cx="256" cy="256" r="46" fill="#19D3A2" opacity="0.7" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="46" fill="url(#mint)"/>
    <circle cx="256" cy="256" r="45" fill="url(#rim)"/>
    <path d="M234 258 L250 274 L280 238" fill="none" stroke="#00457C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- glass edge -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
</svg>
